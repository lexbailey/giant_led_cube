[package]
name = "service"
version = "0.1.0"
edition = "2021"
authors = ["Lex Bailey"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
debug_device_stream = []
output_mode_jumbotron = ["gl", "glfw", "gl_abstractions"]

[dependencies]
clap = { version = "3.1.5", features = ["derive"] }
pest = "2.0"
plain_authentic_commands = { path="../plain_authentic_commands", features = ["challenge"] }
cube_model = { path="../cube_model" }
game_timer = { path="../game_timer" }
serialport = "4.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0.30"
rodio = "0.15.0"
rand = "0.8.5"
reqwest = { version = "0.11", features = ["blocking", "json"] }
chrono = "0.4"
tee_readwrite = "0.1.0"
glfw = { version="0.61.0", optional=true, default-features=false, features=["image", "log", "raw-window-handle-v0-6", "x11"] }
gl = { version="0.14.0", optional=true }
gl_abstractions = { path="../gl_abstractions", optional=true }
